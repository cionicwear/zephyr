CONFIG_GPIO=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_SERIAL=y
CONFIG_SOC_SERIES_NRF52X=y
CONFIG_SOC_NRF52820_QDAA=y
CONFIG_ARM_MPU=y
CONFIG_HW_STACK_PROTECTION=y
CONFIG_DYNAMIC_INTERRUPTS=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=512
CONFIG_USE_SEGGER_RTT=n
CONFIG_ENTROPY_NRF5_THR_THRESHOLD=4
CONFIG_ENTROPY_NRF5_ISR_THRESHOLD=12

# CONFIG_PRINTK is not set
CONFIG_BOOTLOADER_MCUBOOT=y


# BT
CONFIG_BT=y
CONFIG_BT_HCI_RAW=y
CONFIG_BT_HCI_RAW_H4=y
CONFIG_BT_HCI_RAW_H4_ENABLE=y
CONFIG_BT_MAX_CONN=2
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_EVT_DISCARDABLE_SIZE=251
CONFIG_BT_BUF_CMD_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_BUF_EVT_RX_SIZE=255
CONFIG_BT_CTLR_DTM_HCI=y
CONFIG_BT_CTLR_ASSERT_HANDLER=y
CONFIG_BT_RX_STACK_SIZE=2048
# Workaround: Unable to allocate command buffer when using K_NO_WAIT since
# Host number of completed commands does not follow normal flow control.
CONFIG_BT_BUF_CMD_TX_COUNT=10
CONFIG_BT_CTLR_RX_BUFFERS=12
CONFIG_BT_BUF_ACL_RX_COUNT=6

CONFIG_BT_CTLR_PHY_2M=y

CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_CALIBRATION_PERIOD=1000
CONFIG_BT_CTLR_ASSERT_HANDLER=y

# Interrupts
CONFIG_DYNAMIC_INTERRUPTS=y
CONFIG_IRQ_OFFLOAD=y

CONFIG_BT_DEBUG_LOG=n
CONFIG_LOG=n
CONFIG_LOG_DEFAULT_LEVEL=3

# # Console
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_STDOUT_CONSOLE=y
CONFIG_PRINTK=n
CONFIG_EARLY_CONSOLE=n

CONFIG_BT_DEBUG_LOG=n

CONFIG_RTT_CONSOLE=n
CONFIG_LOG_BACKEND_SHOW_COLOR=n
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1024
CONFIG_LOG_STRDUP_BUF_COUNT=10

CONFIG_REBOOT=y
CONFIG_EXTRA_EXCEPTION_INFO=y